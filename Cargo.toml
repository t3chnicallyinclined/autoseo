[package]
name = "autoseo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = "4"
futures-util = "0.3"
hound = "3"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray"] }
ort-sys = "=2.0.0-rc.9"
rand = "0.8"
regex = "1"
percent-encoding = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "fs", "net", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
open = "5"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
url = "2"
whisper-rs = { version = "0.13", optional = true }
indicatif = "0.17"
ndarray = "0.16"
rustfft = "6"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", features = ["tract"], optional = true }

[features]
default = []
local-stt = ["whisper-rs"]
enhance = ["deep_filter"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
